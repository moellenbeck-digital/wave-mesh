# Der Control-Server: der einzige öffentliche Port des Waves. Was er nicht
# selbst besitzt, reicht er an sein Next.js weiter (WAVE_WEB_URL) -- deshalb
# zeigt der Ingress nur hierher und nie auf wave-web.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wave-control
  labels:
    app.kubernetes.io/name: wave-control
    app.kubernetes.io/part-of: wave-mesh
spec:
  # Genau einer, und das ist keine Sparsamkeit: der NetmapHub
  # (apps/control/src/routes/control-ws.ts) hält die offenen /v1/control-Sockets
  # in einer Map im Prozess. Ein zweiter Pod bekäme die Hälfte der Geräte und
  # erführe nie, dass die andere Hälfte eine neue Netmap braucht -- ein Gerät
  # bliebe auf einer alten Netzkarte stehen, ohne dass irgendwo etwas rot wird.
  # Wer hier hochskalieren will, braucht vorher einen Hub über alle Prozesse.
  replicas: 1
  # Aus demselben Grund kein RollingUpdate: zwei Prozesse gleichzeitig sind
  # genau der Zustand, den replicas: 1 vermeidet.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wave-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wave-control
        app.kubernetes.io/part-of: wave-mesh
    spec:
      # Kubernetes legt für jeden Service im Namensraum die alten
      # Docker-Link-Variablen an -- der Service `wave-relay` also
      # WAVE_RELAY_PORT=tcp://10.43.x.x:3479, und genau daraus liest der Relay
      # seinen Port: `Number("tcp://…")` ist NaN, und er startet mit
      # ERR_OUT_OF_RANGE gar nicht erst. Gefunden werden die Dienste hier über
      # DNS, diese Variablen braucht keiner von ihnen.
      enableServiceLinks: false
      # Die Images liegen in einer privaten Registry; ohne diesen Verweis zieht
      # das Kubelet anonym und bekommt 401. Den Inhalt erzeugt das Overlay --
      # der Name ist hier fest, damit die Basis nicht wissen muss, wer ihn
      # ausfüllt.
      imagePullSecrets:
        - name: ghcr
      securityContext:
        # Das Image läuft als `USER bun`, und das ist ein *Name*. Mit
        # runAsNonRoot allein verweigert das Kubelet den Start ("cannot verify
        # user is non-root"), weil es einen Namen nicht auflösen kann -- die
        # Zahl muss dazu und muss zum Benutzer `bun` im Image passen (1000).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Dasselbe Image, anderes Kommando: die Migrationen reisen darin mit.
        # Als initContainer statt als Job, weil ein Job unveränderlich ist --
        # `kubectl apply` auf einen geänderten Job scheitert, und ein Job mit
        # wechselndem Namen sammelt sich an. Hier läuft er vor jedem Start des
        # einen Pods, also nie parallel zu sich selbst, und das Journal sorgt
        # dafür, dass ein zweiter Lauf nichts doppelt anwendet. Steht die
        # Datenbank noch nicht, scheitert er und wird wiederholt -- ein
        # `Init:Error` in den ersten Sekunden ist deshalb kein Fehlerbild.
        - name: migrate
          image: ghcr.io/pinguin45orga/wave-mesh/control
          command: ["bun", "apps/control/src/db/migrate.ts"]
          envFrom:
            - configMapRef:
                name: wave-control-config
            - secretRef:
                name: wave-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      containers:
        - name: control
          image: ghcr.io/pinguin45orga/wave-mesh/control
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef:
                name: wave-control-config
            - secretRef:
                name: wave-secrets
          # /healthz fasst die Datenbank nicht an. Das ist hier Absicht (eine
          # Sonde, die bei jedem Durchgang eine Abfrage fährt, ist eine Last)
          # und zugleich die bekannte Lücke: am 15.09.2026 antwortete /healthz
          # mit 200, während jede Registrierung an einer unerreichbaren
          # Datenbank scheiterte. Diese Sonde sagt "der Prozess lebt", nicht
          # "der Stapel trägt" -- Letzteres sagt nur ein `wave login`.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Startwerte, nicht gemessen: hier lief noch kein Cluster.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: wave-control
  labels:
    app.kubernetes.io/name: wave-control
spec:
  selector:
    app.kubernetes.io/name: wave-control
  ports:
    - { name: http, port: 8080, targetPort: http }
