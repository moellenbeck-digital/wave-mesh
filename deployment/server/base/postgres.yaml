# Die Datenbank des Waves. Ein einzelner Pod mit einem Volume, und das ist
# ehrlich zu sagen, was er nicht kann: kein Backup, kein Failover, kein
# Point-in-Time-Restore. Verliert er sein Volume, ist der Wave weg -- jedes
# Gerät müsste sich neu anmelden.
#
# Wer einen verwalteten Dienst hat, nimmt ihn: DATABASE_URL im Secret zeigt
# dann dorthin, und diese StatefulSet-Zeile fällt im Overlay heraus (wie das
# geht, steht in overlays/prod/kustomization.yaml).
apiVersion: v1
kind: Service
metadata:
  name: wave-postgres
  labels:
    app.kubernetes.io/name: wave-postgres
spec:
  selector:
    app.kubernetes.io/name: wave-postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wave-postgres
  labels:
    app.kubernetes.io/name: wave-postgres
spec:
  serviceName: wave-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wave-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wave-postgres
    spec:
      # Kubernetes legt für jeden Service im Namensraum die alten
      # Docker-Link-Variablen an -- der Service `wave-relay` also
      # WAVE_RELAY_PORT=tcp://10.43.x.x:3479, und genau daraus liest der Relay
      # seinen Port: `Number("tcp://…")` ist NaN, und er startet mit
      # ERR_OUT_OF_RANGE gar nicht erst. Gefunden werden die Dienste hier über
      # DNS, diese Variablen braucht keiner von ihnen.
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: wave }
            - { name: POSTGRES_DB, value: wave }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: wave-secrets, key: POSTGRES_PASSWORD }
            # Das Volume wird auf /var/lib/postgresql/data gemountet, und
            # manche Storage-Klassen legen dort ein lost+found ab. initdb
            # verweigert dann ein nicht leeres Verzeichnis -- deshalb ein
            # Unterverzeichnis.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wave"]
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
