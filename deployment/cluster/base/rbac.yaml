apiVersion: v1
kind: ServiceAccount
metadata:
  name: wave-connector
---
# Nur lesen, und nur die drei Arten, aus denen Namen kommen. Der Operator ist
# kein zweiter Wahrheitsort -- er sagt weiter, was ohnehin im Cluster steht.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wave-connector
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wave-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wave-connector
subjects:
  - kind: ServiceAccount
    name: wave-connector
    namespace: wave
