# Der interne Ingress-Controller des Waves: ein Traefik, der ausschließlich die
# Klasse `wave` bedient und nur eine ClusterIP hat.
#
# Er ist der Grund, warum „nur aus dem Wave erreichbar" überhaupt gilt. wave
# macht einen Dienst erreichbar; *un*erreichbar machen kann es ihn nicht -- das
# muss aus dem Cluster kommen, und hier steht es: kein LoadBalancer, kein
# NodePort, kein hostNetwork, und davor eine NetworkPolicy, die nur den
# Connector-Pod durchlässt.
#
# Derselbe Klassenname trägt beide Seiten: Traefik bedient die Ingresses der
# Klasse `wave`, und der Operator (WAVE_INGRESS_CLASS) meldet genau deren Hosts
# an den Control-Server. Ein Name, eine Entscheidung.
#
# Wer im Cluster schon einen internen Controller hat, nimmt diese Datei im
# Overlay wieder heraus und zeigt mit WAVE_BACKEND_IPV4 auf dessen ClusterIP.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wave-ingress
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: wave
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wave-ingress
rules:
  # Nur lesen, und nur, was ein Ingress-Controller zum Routen braucht.
  # `secrets` ist dabei das eine Recht, das weh tut -- es ist für die
  # TLS-Zertifikate der Ingresses und lässt sich nicht vermeiden, solange
  # Traefik sie aus dem Cluster liest.
  - apiGroups: [""]
    # `nodes` sieht nach zu viel aus und ist doch nötig: Traefiks
    # Kubernetes-Provider startet für jede dieser Ressourcen einen Informer und
    # wartet, bis *alle* synchron sind. Fehlt das Recht, wird einer davon nie
    # fertig, es wird nie eine Konfiguration veröffentlicht -- und dann
    # antwortet er auf jede Anfrage mit 404, ohne dass im Log etwas von einem
    # Ingress steht. Genau so gemessen am 21.09.2026.
    resources: ["services", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wave-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wave-ingress
subjects:
  - kind: ServiceAccount
    name: wave-ingress
    namespace: wave
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wave-ingress
  labels:
    app.kubernetes.io/name: wave-ingress
    app.kubernetes.io/part-of: wave-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wave-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wave-ingress
        app.kubernetes.io/part-of: wave-mesh
    spec:
      serviceAccountName: wave-ingress
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.3
          args:
            # Über 1024, damit der Prozess keine Capability braucht -- die
            # 80 und 443 des Dienstes bildet der Service darauf ab.
            - --entryPoints.web.address=:8000/tcp
            - --entryPoints.websecure.address=:8443/tcp
            - --entryPoints.traefik.address=:9000/tcp
            - --ping=true
            # Genau ein Provider: Ingresses dieser Klasse. Keine CRDs, keine
            # IngressRoute -- was dieser Controller kann, soll aus dem
            # Ingress-Objekt ablesbar sein, das auch der Operator liest.
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=wave
            - --log.level=INFO
          ports:
            - { name: web, containerPort: 8000 }
            - { name: websecure, containerPort: 8443 }
            - { name: admin, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /ping, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
# ClusterIP, und nichts sonst. Diese Adresse trägt der Connector in seine
# nftables-Regel (WAVE_BACKEND_IPV4) -- sie muss also festliegen, siehe den
# Patch im Overlay.
apiVersion: v1
kind: Service
metadata:
  name: wave-ingress
  labels:
    app.kubernetes.io/name: wave-ingress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wave-ingress
  ports:
    - { name: web, port: 80, targetPort: web }
    - { name: websecure, port: 443, targetPort: websecure }
---
# Der zweite Teil von „nur aus dem Wave": erreichbar ist dieser Controller nur
# vom Connector-Pod. Alles andere im Cluster -- und jeder andere Namensraum --
# läuft gegen diese Regel.
#
# Zu wissen: eine NetworkPolicy ist nur so viel wert wie ihre Durchsetzung. k3s
# bringt dafür den Netpol-Controller von kube-router mit; wurde er mit
# `--disable-network-policy` abgeschaltet, ist diese Datei Dekoration.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wave-ingress-only-from-connector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wave-ingress
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wave-connector
