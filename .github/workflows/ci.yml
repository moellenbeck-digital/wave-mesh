name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/core/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: cd apps/web && bun run typecheck
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cd mobile/fixtures && bun run generate
      - run: ./mobile/build.sh check
