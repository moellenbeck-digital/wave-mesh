# The iPhone app into TestFlight, from a button.
#
# Started by hand -- from the Actions tab, or the GitHub app on a phone -- and
# never by a push: a TestFlight build goes to every internal tester, so it is a
# decision like a release, not the side effect of a commit. That is the same
# line release.yml draws, and why this is a workflow of its own rather than a
# trigger there: an app build has nothing to do with a version tag.
#
# Before anything is uploaded, three jobs test what the app depends on (see
# below); a red one stops the build. Then it does what mobile/ios/upload.sh
# does on a Mac: build the Go core,
# generate the project, archive, sign, upload. The signing material comes from
# the 1Password vault "wave-mesh CI" through the same service account the
# release job uses, so no Apple secret is stored in GitHub. The build number is
# the next free one on App Store Connect, whoever uploaded last.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (off: build and sign only)"
        type: boolean
        default: true

# One upload at a time: two runs would ask App Store Connect for the same next
# number, and the second upload would be refused.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What the app depends on, held against everything that has broken before.
  # The upload waits for all three: a build goes to every tester, and the
  # failures of the last weeks -- a second wave whose names did not resolve, a
  # connector nobody could reach, sessions reset by every netmap, a log that
  # drew black -- each has a test below now. A red one stops the build.
  verify:
    name: Unit tests and the Go core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: mobile/core/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      # The phone's core is checked against the TypeScript side's own bytes:
      # canonical JSON, signatures, disco, DNS. Regenerated, as in release.yml.
      - name: Regenerate the cross-implementation fixtures
        run: cd mobile/fixtures && bun run generate
      - name: Go core (gofmt, vet, go test -race, bindings)
        run: ./mobile/build.sh check

  e2e:
    name: End-to-end (the phone's core against real servers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-go@v5
        with:
          # go.mod's pin, for the reason release.yml gives: the scripts build
          # the core in a namespace without DNS, where a missing toolchain
          # cannot be fetched.
          go-version-file: mobile/core/go.mod
          cache-dependency-path: mobile/core/go.sum
      - name: Build wireguard-go
        run: |
          set -euo pipefail
          version="$(grep -oP '^WIREGUARD_GO_VERSION="\K[^"]+' scripts/build-clients.sh)"
          go install "golang.zx2c4.com/wireguard@$version"
      - name: Warm the module cache for the mobile core
        run: cd mobile/core && go mod download
      - run: bun install --frozen-lockfile
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      # Two waves on one interface, one resolver for both zones, a restart
      # that keeps addresses and port.
      - name: The core carries two waves over one interface
        run: ./test/e2e/mobile-core.sh
      # Every step the app takes, through wavemobile: login, cancel, pause,
      # leave, rename, a removed device, a restart, a second wave at one server.
      - name: Every step of the app against real servers
        run: ./test/e2e/mobile-lifecycle.sh
      # A connector with the production ruleset: IPv4, IPv6 refused at once,
      # 40 netmap changes, relay only, an access policy.
      - name: A cluster's services through a connector
        run: ./test/e2e/mobile-services.sh
      - name: The core punches through two NATs
        run: ./test/e2e/mobile-nat.sh
      - name: The core falls back to the relay
        run: ./test/e2e/mobile-nat.sh --symmetric
      # The other side of every test above is the desktop client and the
      # server, both changed for the phones as well.
      - name: One device in two waves at once
        run: ./test/e2e/two-waves.sh
      - name: One device in two waves at the same server
        run: ./test/e2e/same-server.sh
      - name: Two nodes behind NATs punch a direct path
        run: ./test/e2e/nat-traversal.sh
      # A paused wave serves empty netmaps to every device, the phone included;
      # resuming has to bring the mesh back without a new approval.
      - name: A billed wave is paused, resumed, held to its seats and swept
        run: ./test/e2e/billing.sh

  ios-tests:
    name: iOS unit and UI tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: mobile/core/go.sum
      - name: Tools
        run: brew install xcodegen
      - name: Build the Go core
        run: ./mobile/build.sh ios
      - name: Pick a simulator
        id: sim
        # Whatever iPhone the runner's Xcode ships: a hardcoded name breaks
        # with the next runner image.
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); raise SystemExit
          ')
          echo "id=$id" >>"$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$id"
      - name: Generate the project
        run: cd mobile/ios && xcodegen generate --quiet
      # The Go core's JSON as the app decodes it, the tunnel's safety rules,
      # the invite parser.
      - name: Unit tests
        run: |
          cd mobile/ios
          xcodebuild -scheme WaveTunnelTests -destination "id=${{ steps.sim.outputs.id }}" test | tail -40
          exit "${PIPESTATUS[0]}"
      # Every screen against a stand-in tunnel: login, pause, leave, removed,
      # another VPN, services, the log (6000 lines), relay per wave, a second
      # wave at one server, the QR link, check connection.
      - name: UI tests
        run: |
          cd mobile/ios
          xcodebuild -scheme Wave -destination "id=${{ steps.sim.outputs.id }}" -resultBundlePath ui-tests.xcresult test | tail -60
          exit "${PIPESTATUS[0]}"
      - name: Keep the UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests
          path: mobile/ios/ui-tests.xcresult
          retention-days: 3

  ios:
    name: iOS to TestFlight
    needs: [verify, e2e, ios-tests]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The SDK has to match what the app is built with on a Mac (Xcode 26).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: mobile/core/go.sum

      - name: Tools
        run: brew install xcodegen

      # Always from source: an xcframework left over from somewhere else is a
      # build with an old core in it, and nothing in the app would say so.
      - name: Build the Go core
        run: ./mobile/build.sh ios

      - name: Load the signing material
        id: secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          export-env: false
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ASC_KEY_ID: op://ru5ydmxogt5ckmkebfezdzh5fa/cumkhcjndrtnrqjlptpriqize4/apple_api_key_id
          ASC_ISSUER_ID: op://ru5ydmxogt5ckmkebfezdzh5fa/cumkhcjndrtnrqjlptpriqize4/apple_api_issuer_id
          ASC_KEY_P8_BASE64: op://ru5ydmxogt5ckmkebfezdzh5fa/cumkhcjndrtnrqjlptpriqize4/apple_api_private_key_p8_base64
          DIST_P12_BASE64: op://ru5ydmxogt5ckmkebfezdzh5fa/3hwohqqilniqu5o6al5no4mvga/jumy7blvavc6aggdphln767do4
          DIST_P12_PASSWORD: op://ru5ydmxogt5ckmkebfezdzh5fa/3hwohqqilniqu5o6al5no4mvga/uxrk3qxbh6txzghc6kkakhlxde
          APP_PROFILE_BASE64: op://ru5ydmxogt5ckmkebfezdzh5fa/3hwohqqilniqu5o6al5no4mvga/fdkocgfeirxykblaapjcecmwdm
          TUNNEL_PROFILE_BASE64: op://ru5ydmxogt5ckmkebfezdzh5fa/3hwohqqilniqu5o6al5no4mvga/amzfcfjxxyifehfsodmuxpnaxi

      - name: Build, sign and upload
        id: upload
        env:
          ASC_KEY_ID: ${{ steps.secrets.outputs.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ steps.secrets.outputs.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ steps.secrets.outputs.ASC_KEY_P8_BASE64 }}
          DIST_P12_BASE64: ${{ steps.secrets.outputs.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ steps.secrets.outputs.DIST_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ steps.secrets.outputs.APP_PROFILE_BASE64 }}
          TUNNEL_PROFILE_BASE64: ${{ steps.secrets.outputs.TUNNEL_PROFILE_BASE64 }}
          UPLOAD: ${{ inputs.upload && '1' || '0' }}
        run: |
          BUILD_NUMBER=$(node mobile/ios/next-build-number.mjs)
          export BUILD_NUMBER
          echo "build=$BUILD_NUMBER" >>"$GITHUB_OUTPUT"
          ./mobile/ios/upload.sh

      - name: Summary
        env:
          BUILD: ${{ steps.upload.outputs.build }}
          UPLOADED: ${{ inputs.upload }}
        run: |
          {
            echo "### wave-mesh iOS build $BUILD"
            echo
            echo "From \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
            if [[ "$UPLOADED" == "true" ]]; then
              echo "Uploaded. App Store Connect processes it for a few minutes; then it is in TestFlight for the internal group."
            else
              echo "Built and signed only; nothing was uploaded."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
