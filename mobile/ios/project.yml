# The Xcode project, as text. `xcodegen generate` (in this directory) writes
# Wave.xcodeproj from it; the .xcodeproj itself is not checked in -- it is an
# XML file full of UUIDs that nobody edits by hand, and this file is what a
# change is reviewed in. Requires ios/Frameworks/Wavemobile.xcframework first:
# ../build.sh ios
#
# The identifiers are registered in the Apple Developer account of
# Moellenbeck-Digital UG (team L6R92A4Y7C) and cannot change once the app is
# in the store. Shared/Identifiers.swift holds the same strings for the code.
name: Wave
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: L6R92A4Y7C
    CODE_SIGN_STYLE: Automatic
    # Shown in the store and in Settings; the build number is set by the build
    # (CI run number), so every upload is new to App Store Connect.
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # iPhone and iPad.
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Wave:
    type: application
    platform: iOS
    sources:
      - path: Wave
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: wave-mesh
        PRODUCT_BUNDLE_IDENTIFIER: org.wavemesh.app
        # Empty for local builds (automatic signing); upload.sh sets both to
        # the App Store profiles and switches to manual signing.
        PROVISIONING_PROFILE_SPECIFIER: $(WAVE_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Petrol, the one accent (DESIGN.md, "Mobile Apps").
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: wave-mesh
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad multitasking needs all four.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Wave/Info.plist
      properties:
        # The languages the string catalog carries; the store lists them.
        CFBundleLocalizations: [en, de]
        CFBundleDevelopmentRegion: en
        # WireGuard is standard cryptography (Noise, ChaCha20-Poly1305), and
        # App Store Connect classified the first build as exempt from that
        # answer. Declared here so no upload waits on the question again;
        # revisit before distributing in France, which needs its own filing.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Wave/Wave.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.org.wavemesh.app]
    dependencies:
      - target: WaveTunnel
        embed: true
  WaveTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: WaveTunnel
      - path: Shared
      # The tunnel's error messages look up their own bundle, not the app's.
      - path: Wave/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: WaveTunnel
        PRODUCT_BUNDLE_IDENTIFIER: org.wavemesh.app.tunnel
        PROVISIONING_PROFILE_SPECIFIER: $(WAVE_TUNNEL_PROFILE)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: wave-mesh Tunnel
        # gomobile frameworks are static libraries: linked, not embedded.
        OTHER_LDFLAGS: "-lresolv"
    info:
      path: WaveTunnel/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: WaveTunnel/WaveTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.org.wavemesh.app]
    dependencies:
      - framework: Frameworks/Wavemobile.xcframework
        embed: false
  WaveTunnelTests:
    # The settings reader against the core's contract file. A plain unit test
    # bundle without a host app: it needs NetworkExtension's types, not a tunnel,
    # so it runs on any simulator.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WaveTunnelTests
      - path: WaveTunnel/TunnelSettings.swift
      - path: Shared/Status.swift
      - path: Shared/Identifiers.swift
      - path: Wave/LoginFailure.swift
      - path: ../core/wavesettings/testdata/settings.json
        buildPhase: resources
      - path: ../core/waveengine/testdata/status.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wavemesh.app.tunnel-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  WaveUITests:
    # What a person can do in the app, in the simulator, against FakeTunnel
    # (debug builds only). The tunnel itself is tested on Linux.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WaveUITests
    dependencies:
      - target: Wave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.wavemesh.app.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Wave
        CODE_SIGNING_ALLOWED: NO
schemes:
  Wave:
    build:
      targets:
        Wave: all
    archive:
      config: Release
    test:
      targets:
        - WaveUITests
  WaveTunnelTests:
    build:
      targets:
        WaveTunnelTests: [test]
    test:
      targets:
        - WaveTunnelTests
